manifestVersion: 1
id: org.tooldeck.node-example
name: Node.js Example
version: "1.0.0"
description: Preview a greeting or save it to a file.
hostApi: "^1.0.0"

# Omitting platforms allows all platforms and architectures.
runtime:
  kind: nodejs
  version: ">=22.0.0 <23.0.0"
  source: system

dependencies:
  manager: npm
  file: package.json

settings:
  prefix:
    schema:
      type: string
      minLength: 1
      default: Hello
    ui:
      label: Greeting prefix
      component: text
  uppercase:
    schema:
      type: boolean
      default: false
    ui:
      label: Uppercase greeting
      component: checkbox

actions:
  table:
    name: Show table
    entry: table.mjs
    execution:
      timeoutSeconds: 30

  preview:
    name: Preview greeting
    entry: preview.mjs
    execution:
      timeoutSeconds: 30
    params:
      name:
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 120
          default: ToolDeck
        ui:
          label: Name
          component: text

  write:
    name: Save greeting
    description: Choose a new file in an existing directory.
    entry: write.mjs
    execution:
      timeoutSeconds: 30
    params:
      name:
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 120
          default: ToolDeck
        ui:
          label: Name
          component: text
      destination:
        required: true
        schema:
          type: string
          minLength: 1
        ui:
          label: Destination
          component: file
          mode: save
        path:
          kind: file
          mustExist: false

docs:
  - id: overview
    title: User guide
    path: README.md
